# yaml-language-server: $schema=../scenario.schema.json
# ═══════════════════════════════════════════════════════════════════════════════
# Banking Declined Card - Compound Response Evaluation
# ═══════════════════════════════════════════════════════════════════════════════
# Targets: Agent making multiple tool calls without user interaction
#
# Problem Being Captured:
# - Agent calls get_user_profile → lookup_decline_code → handoff in one turn
# - Agent doesn't ask clarifying questions, just assumes and acts
# - Agent chains multiple tool results into one massive response
#
# Success Criteria:
# - Agent calls ONE tool type per turn (lookup OR handoff, not both)
# - Agent asks clarifying questions before taking action
# - Agent gives user opportunity to guide the conversation
# ═══════════════════════════════════════════════════════════════════════════════

scenario_name: banking_declined_card_compound_response
description: |
  Test that agents don't compound multiple tool calls into single turns.
  Validates turn-taking discipline: agent should ask, wait, then act.
  NOT: agent asks + acts + hands off in one breath.

# Demo user with banking profile for realistic tool responses
demo_user:
  full_name: "Sarah Johnson"
  email: "sarah.johnson@example.com"
  phone_number: "+18885551234"
  scenario: banking
  seed: 42
  persist: false

session_config:
  agents:
    - BankingConcierge
    - DeclineSpecialist

  start_agent: BankingConcierge
  handoff_type: announced

  handoffs:
    - from: BankingConcierge
      to: DeclineSpecialist
      tool: handoff_decline_specialist
      type: discrete
      share_context: true
      handoff_condition: |
        Transfer to DeclineSpecialist when the customer:
        - Reports a declined card transaction
        - Asks why their card was declined

    - from: DeclineSpecialist
      to: BankingConcierge
      tool: handoff_concierge
      type: discrete
      share_context: true

  generic_handoff:
    enabled: true
    allowed_targets:
      - DeclineSpecialist
      - BankingConcierge
    default_type: announced
    share_context: true

  agent_defaults:
    institution_name: "Contoso Bank"
    industry: "banking"

agent_overrides:
  - agent: BankingConcierge
    model_override:
      deployment_id: gpt-4o
      temperature: 0.7
      max_tokens: 500

  - agent: DeclineSpecialist
    model_override:
      deployment_id: gpt-4o
      temperature: 0.6
      max_tokens: 500

# ═══════════════════════════════════════════════════════════════════════════════
# Compound Response Test Turns
# ═══════════════════════════════════════════════════════════════════════════════
# Tests that agent doesn't chain tool calls inappropriately.
# Uses tools_forbidden to prevent premature actions.
# ═══════════════════════════════════════════════════════════════════════════════

turns:
  # Turn 1: Vague complaint - agent should NOT immediately look up decline codes
  - turn_id: turn_1_vague_complaint
    user_input: "I have a problem with my card."
    expectations:
      tools_called: []
      tools_optional:
        - get_user_profile
        - verify_client_identity
      # Should NOT already be looking up decline codes or handing off
      tools_forbidden:
        - lookup_decline_code
        - handoff_decline_specialist
        - handoff_to_agent
        - get_recent_transactions
      no_handoff: true
      response_constraints:
        # Should ask what kind of problem
        must_ask_for:
          - "help"
        max_tokens: 60

  # Turn 2: User says declined, but doesn't specify which card
  - turn_id: turn_2_declined_no_card_specified
    user_input: "It got declined at the store."
    expectations:
      tools_called:
        - get_user_profile
      # Should NOT immediately hand off - need to know which card first
      tools_forbidden:
        - handoff_decline_specialist
        - handoff_to_agent
      no_handoff: true
      response_constraints:
        must_ask_for:
          - "which card"
        max_tokens: 80

  # Turn 3: User identifies card - THIS is when handoff should happen
  # Agent should NOT also call lookup_decline_code
  - turn_id: turn_3_card_identified_handoff_only
    user_input: "My Rewards card, the gold one."
    expectations:
      tools_called: []
      tools_optional:
        - handoff_decline_specialist
        - handoff_to_agent
      # Should NOT look up decline info - that's DeclineSpecialist's job
      tools_forbidden:
        - lookup_decline_code
        - get_recent_transactions
      handoff:
        to_agent: DeclineSpecialist
      response_constraints:
        max_tokens: 60

  # Turn 4: Now with DeclineSpecialist - user asks why
  # Should look up code, NOT also recommend solutions in same turn
  - turn_id: turn_4_why_declined
    user_input: "Can you tell me why?"
    expectations:
      tools_optional:
        - lookup_decline_code
        - get_recent_transactions
      # Should NOT already be searching for solutions
      tools_forbidden:
        - search_knowledge_base
        - unblock_card
        - request_limit_increase
      no_handoff: true
      response_constraints:
        max_tokens: 100
        # Should explain the reason, then WAIT for user to ask what to do
        must_not_include:
          - "recommend"
          - "I suggest"
          - "you should"
          - "next steps"

  # Turn 5: User asks what to do - NOW recommendations are appropriate
  - turn_id: turn_5_what_to_do
    user_input: "What can I do about it?"
    expectations:
      tools_called: []
      tools_optional:
        - search_knowledge_base
        - get_card_status
      no_handoff: true
      response_constraints:
        max_tokens: 100

thresholds:
  min_tool_precision: 0.50
  min_tool_recall: 0.40
  min_grounded_ratio: 0.4
  max_latency_p95_ms: 10000

foundry_export:
  enabled: true
  output_filename: declined_card_compound_eval.jsonl
  context_source: evidence
  evaluators:
    - id: builtin.relevance
      init_params:
        deployment_name: gpt-4o
      data_mapping:
        query: "${data.query}"
        response: "${data.response}"
        context: "${data.context}"
    - id: builtin.coherence
      init_params:
        deployment_name: gpt-4o
      data_mapping:
        query: "${data.query}"
        response: "${data.response}"

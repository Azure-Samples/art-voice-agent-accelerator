# yaml-language-server: $schema=../scenario.schema.json
# ═══════════════════════════════════════════════════════════════════════════════
# Banking Declined Card - Verbosity Evaluation
# ═══════════════════════════════════════════════════════════════════════════════
# Targets: Verbose agent responses that overwhelm the user
#
# Problem Being Captured:
# - Agent provides lengthy explanations when short responses are appropriate
# - Agent front-loads information before user asks follow-up questions
# - Agent explains multiple possibilities instead of asking clarifying questions
#
# Success Criteria:
# - Responses stay under token budget
# - Agent asks ONE question at a time
# - Agent doesn't over-explain before user indicates need
# ═══════════════════════════════════════════════════════════════════════════════

scenario_name: banking_declined_card_verbosity
description: |
  Test that agents provide concise responses during declined card flow.
  Validates that agents don't overwhelm users with verbose explanations
  and keep responses appropriately short for voice interactions.

# Demo user with banking profile for realistic tool responses
demo_user:
  full_name: "Sarah Johnson"
  email: "sarah.johnson@example.com"
  phone_number: "+18885551234"
  scenario: banking
  seed: 42
  persist: false

session_config:
  agents:
    - BankingConcierge
    - DeclineSpecialist

  start_agent: BankingConcierge
  handoff_type: announced

  handoffs:
    - from: BankingConcierge
      to: DeclineSpecialist
      tool: handoff_decline_specialist
      type: discrete
      share_context: true
      handoff_condition: |
        Transfer to DeclineSpecialist when the customer:
        - Reports a declined card transaction
        - Asks why their card was declined

    - from: DeclineSpecialist
      to: BankingConcierge
      tool: handoff_concierge
      type: discrete
      share_context: true

  generic_handoff:
    enabled: true
    allowed_targets:
      - DeclineSpecialist
      - BankingConcierge
    default_type: announced
    share_context: true

  agent_defaults:
    institution_name: "Contoso Bank"
    industry: "banking"

agent_overrides:
  - agent: BankingConcierge
    model_override:
      deployment_id: gpt-4o
      temperature: 0.7
      max_tokens: 500

  - agent: DeclineSpecialist
    model_override:
      deployment_id: gpt-4o
      temperature: 0.6
      max_tokens: 500

# ═══════════════════════════════════════════════════════════════════════════════
# Verbosity Test Turns
# ═══════════════════════════════════════════════════════════════════════════════
# Each turn tests for concise, conversational responses.
# max_tokens constraints are tight to catch verbose behavior.
# ═══════════════════════════════════════════════════════════════════════════════

turns:
  # Turn 1: Simple decline report - should get acknowledgment + ONE question
  - turn_id: turn_1_simple_decline_report
    user_input: "My card was declined."
    expectations:
      tools_called:
        - get_user_profile
      tools_optional:
        - verify_client_identity
      no_handoff: true
      response_constraints:
        # Voice-appropriate: ~10-15 seconds of speech
        max_tokens: 80
        # Should ask which card, not explain all possible decline reasons
        must_ask_for:
          - "which card"
        # Should NOT pre-explain decline reasons before knowing which card
        must_not_include:
          - "several reasons"
          - "common causes"
          - "fraud protection"
          - "insufficient funds"

  # Turn 2: User gives card name - should acknowledge + handoff (minimal words)
  - turn_id: turn_2_card_identified
    user_input: "The blue Marketplace card."
    expectations:
      tools_optional:
        - handoff_decline_specialist
        - handoff_to_agent
      handoff:
        to_agent: DeclineSpecialist
      response_constraints:
        # Handoff announcement should be brief
        max_tokens: 60
        # Should NOT explain what DeclineSpecialist will do in detail
        must_not_include:
          - "they will"
          - "specialist will"
          - "able to help you with"

  # Turn 3: With DeclineSpecialist - simple question, simple answer
  - turn_id: turn_3_decline_code_question
    user_input: "Why was it declined?"
    expectations:
      tools_called: []
      tools_optional:
        - lookup_decline_code
        - get_recent_transactions
      no_handoff: true
      response_constraints:
        # Direct answer, not a lecture
        max_tokens: 100
        # Should NOT list all possible decline codes
        must_not_include:
          - "there are several"
          - "common reasons include"
          - "let me explain all"

  # Turn 4: Simple yes/no question - expects SHORT response
  - turn_id: turn_4_simple_yes_no
    user_input: "Can I use it now?"
    expectations:
      tools_called: []
      tools_optional:
        - get_card_status
      no_handoff: true
      response_constraints:
        # Yes/no + brief context
        max_tokens: 50

  # Turn 5: User asks for help - should give ONE suggestion, then wait
  - turn_id: turn_5_what_can_i_do
    user_input: "What should I do?"
    expectations:
      tools_called: []
      tools_optional:
        - search_knowledge_base
      no_handoff: true
      response_constraints:
        # ONE recommendation, not a bulleted list
        max_tokens: 80
        must_not_include:
          - "first, second"
          - "step 1"
          - "here are your options"
          - "you could also"

thresholds:
  min_tool_precision: 0.50
  min_tool_recall: 0.40
  min_grounded_ratio: 0.4
  max_latency_p95_ms: 10000

foundry_export:
  enabled: true
  output_filename: declined_card_verbosity_eval.jsonl
  context_source: evidence
  evaluators:
    - id: builtin.relevance
      init_params:
        deployment_name: gpt-4o
      data_mapping:
        query: "${data.query}"
        response: "${data.response}"
        context: "${data.context}"
    - id: builtin.coherence
      init_params:
        deployment_name: gpt-4o
      data_mapping:
        query: "${data.query}"
        response: "${data.response}"
    - id: builtin.fluency
      init_params:
        deployment_name: gpt-4o
      data_mapping:
        response: "${data.response}"

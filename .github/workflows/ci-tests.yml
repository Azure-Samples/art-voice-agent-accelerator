name: CI Tests

on:
    push:
        branches: [ main, develop, feature/ci-cleanedup-unit-tests ]
    pull_request:
        branches: [ main, develop ]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.11"]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v4
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Cache pip dependencies
              uses: actions/cache@v3
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('requirements-codequality.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements-codequality.txt ]; then pip install -r requirements-codequality.txt; fi

            - name: Create test environment file
              run: |
                  echo "# Test environment variables" > .env.test
                  echo "ENVIRONMENT=test" >> .env.test

            - name: Run tests with pytest
              run: |
                  pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing || true
                  # Check if pytest succeeded (ignoring coverage issues)
                  pytest tests/ -v --tb=short
              env:
                  PYTHONPATH: ${{ github.workspace }}

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v3
              if: always()
              continue-on-error: true
              with:
                  file: ./coverage.xml
                  flags: unittests
                  name: codecov-umbrella
                  fail_ci_if_error: false